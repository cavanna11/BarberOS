<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: 'Space Grotesk', sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
    </style>
  </defs>
  <rect x="0" y="0" width="280" height="120" rx="8" fill="#fafafa" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- Teléfono con la app instalada -->
  <g transform="translate(22, 10)">
    <rect x="0" y="0" width="58" height="100" rx="9" fill="#0a0a0a"/>
    <rect x="3" y="3" width="52" height="94" rx="7" fill="#ffffff"/>
    <rect x="20" y="6" width="18" height="3" rx="1.5" fill="#0a0a0a"/>
    <!-- grilla de íconos -->
    <g fill="#e5e5e5">
      <rect x="9" y="16" width="10" height="10" rx="2.5"/>
      <rect x="24" y="16" width="10" height="10" rx="2.5"/>
      <rect x="39" y="16" width="10" height="10" rx="2.5"/>
      <rect x="9" y="31" width="10" height="10" rx="2.5"/>
      <rect x="39" y="31" width="10" height="10" rx="2.5"/>
      <rect x="9" y="46" width="10" height="10" rx="2.5"/>
      <rect x="24" y="46" width="10" height="10" rx="2.5"/>
      <rect x="39" y="46" width="10" height="10" rx="2.5"/>
    </g>
    <!-- el ícono de BarberOS, destacado -->
    <rect x="24" y="31" width="10" height="10" rx="2.5" fill="#e03d00"/>
    <circle cx="35" cy="30" r="3.2" fill="#e03d00" stroke="#ffffff" stroke-width="1"/>
    <text x="35" y="31.6" class="font-mono" font-size="4" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="29" y="66" class="font-sans" font-size="4.5" font-weight="700" fill="#0a0a0a" text-anchor="middle">BarberOS</text>
  </g>

  <!-- Notificación que llega -->
  <g transform="translate(96, 26)">
    <rect x="0" y="0" width="166" height="56" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
    <rect x="10" y="10" width="18" height="18" rx="4" fill="#e03d00"/>
    <text x="19" y="23" class="font-sans" font-size="10" fill="#ffffff" text-anchor="middle">✂</text>
    <text x="36" y="17" class="font-mono" font-size="6.5" letter-spacing="0.6" fill="#aaaaaa">BARBEROS · AHORA</text>
    <text x="36" y="30" class="font-sans" font-size="9" font-weight="700" fill="#0a0a0a">Nuevo turno</text>
    <text x="36" y="43" class="font-sans" font-size="8" fill="#555555">Juan reservó Corte · vie 16:00</text>
    <!-- vibración -->
    <path d="M 140 -6 q 4 4 0 8" stroke="#e03d00" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 146 -10 q 7 8 0 16" stroke="#e03d00" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
