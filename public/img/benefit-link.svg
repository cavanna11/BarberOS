<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: 'Space Grotesk', sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
    </style>
  </defs>
  <!-- Card background -->
  <rect x="0" y="0" width="280" height="120" rx="8" fill="#fafafa" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  
  <!-- Instagram Bio header snippet -->
  <g transform="translate(16, 16)">
    <circle cx="20" cy="20" r="20" fill="#e03d00"/>
    <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">LB</text>
    
    <text x="52" y="16" class="font-sans" font-size="13" font-weight="700" fill="#0a0a0a">La Barbería Club</text>
    <text x="52" y="30" class="font-sans" font-size="10" fill="#555555">Cortes · Barba · Buenos Aires</text>
  </g>

  <!-- Custom Link Pill -->
  <g transform="translate(16, 68)">
    <rect x="0" y="0" width="248" height="36" rx="18" fill="#ffffff" stroke="#e03d00" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="6" fill="#e03d00"/>
    <text x="32" y="22" class="font-mono" font-size="11" font-weight="700" fill="#0a0a0a">barberos.app/labarberia</text>
    
    <rect x="180" y="7" width="60" height="22" rx="11" fill="#fdf0eb"/>
    <text x="210" y="22" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#e03d00">RESERVAR</text>
  </g>
</svg>
