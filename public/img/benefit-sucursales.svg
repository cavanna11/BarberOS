<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: 'Space Grotesk', sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
    </style>
  </defs>
  <rect x="0" y="0" width="280" height="120" rx="8" fill="#fafafa" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

  <!-- Una sola cuenta arriba -->
  <g transform="translate(90, 12)">
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#0a0a0a"/>
    <circle cx="15" cy="13" r="5" fill="#e03d00"/>
    <text x="26" y="16.5" class="font-sans" font-size="8" font-weight="700" fill="#ffffff">Tu cuenta</text>
  </g>

  <!-- Las ramas hacia cada sucursal -->
  <path d="M140 40 L140 50 M40 50 L240 50 M40 50 L40 60 M113 50 L113 60 M167 50 L167 60 M240 50 L240 60"
        stroke="rgba(0,0,0,0.18)" stroke-width="1.2" fill="none"/>

  <!-- Cuatro sucursales independientes -->
  <g transform="translate(14, 60)">
    <rect x="0" y="0" width="52" height="44" rx="6" fill="#ffffff" stroke="#e03d00" stroke-width="1.2"/>
    <text x="8" y="14" class="font-mono" font-size="6" fill="#aaaaaa" letter-spacing="0.6">CENTRO</text>
    <text x="8" y="26" class="font-sans" font-size="7" font-weight="700" fill="#0a0a0a">3 barberos</text>
    <text x="8" y="36" class="font-sans" font-size="6.5" fill="#555555">12 turnos hoy</text>
  </g>
  <g transform="translate(87, 60)">
    <rect x="0" y="0" width="52" height="44" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="8" y="14" class="font-mono" font-size="6" fill="#aaaaaa" letter-spacing="0.6">NORTE</text>
    <text x="8" y="26" class="font-sans" font-size="7" font-weight="700" fill="#0a0a0a">2 barberos</text>
    <text x="8" y="36" class="font-sans" font-size="6.5" fill="#555555">8 turnos hoy</text>
  </g>
  <g transform="translate(141, 60)">
    <rect x="0" y="0" width="52" height="44" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="8" y="14" class="font-mono" font-size="6" fill="#aaaaaa" letter-spacing="0.6">PLAYA</text>
    <text x="8" y="26" class="font-sans" font-size="7" font-weight="700" fill="#0a0a0a">4 barberos</text>
    <text x="8" y="36" class="font-sans" font-size="6.5" fill="#555555">15 turnos hoy</text>
  </g>
  <g transform="translate(214, 60)">
    <rect x="0" y="0" width="52" height="44" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
    <text x="8" y="14" class="font-mono" font-size="6" fill="#aaaaaa" letter-spacing="0.6">RUTA</text>
    <text x="8" y="26" class="font-sans" font-size="7" font-weight="700" fill="#0a0a0a">1 barbero</text>
    <text x="8" y="36" class="font-sans" font-size="6.5" fill="#555555">5 turnos hoy</text>
  </g>
</svg>
