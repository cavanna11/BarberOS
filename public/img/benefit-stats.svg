<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: 'Space Grotesk', sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
    </style>
  </defs>
  <rect x="0" y="0" width="280" height="120" rx="8" fill="#fafafa" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  
  <g transform="translate(14, 14)">
    <text x="0" y="12" class="font-mono" font-size="10" fill="#aaaaaa">FACTURACIÓN MENSUAL</text>
    <text x="0" y="34" class="font-sans" font-size="22" font-weight="700" fill="#0a0a0a">$480.000</text>
    
    <rect x="130" y="16" width="122" height="22" rx="11" fill="#eaf7f1"/>
    <text x="191" y="31" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#0f9960">↑ +18% vs mes ant.</text>

    <!-- Mini Bar Chart -->
    <g transform="translate(0, 52)">
      <!-- Bar 1 -->
      <rect x="0" y="18" width="30" height="22" rx="3" fill="#f2f2f2"/>
      <text x="15" y="48" text-anchor="middle" class="font-mono" font-size="8" fill="#aaaaaa">MAY</text>
      <!-- Bar 2 -->
      <rect x="42" y="12" width="30" height="28" rx="3" fill="#f2f2f2"/>
      <text x="57" y="48" text-anchor="middle" class="font-mono" font-size="8" fill="#aaaaaa">JUN</text>
      <!-- Bar 3 -->
      <rect x="84" y="6" width="30" height="34" rx="3" fill="#ff5c1a"/>
      <text x="99" y="48" text-anchor="middle" class="font-mono" font-size="8" fill="#aaaaaa">JUL</text>
      <!-- Bar 4 ACTIVE -->
      <rect x="126" y="0" width="30" height="40" rx="3" fill="#e03d00"/>
      <text x="141" y="48" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#e03d00">AGO</text>
      
      <!-- Top Service Tag -->
      <rect x="170" y="10" width="82" height="24" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="211" y="26" text-anchor="middle" class="font-sans" font-size="9" font-weight="600" fill="#0a0a0a">Top: Corte+Barba</text>
    </g>
  </g>
</svg>
