        <text x="16" y="48" class="font-sans" font-size="20" font-weight="700" fill="#0a0a0a">8 confirmados</text>

        <rect x="225" y="0" width="210" height="64" rx="8" fill="#fafafa" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
        <text x="241" y="24" class="font-mono" font-size="10" fill="#aaaaaa">RECAUDACIÓN ESTIMADA</text>
        <text x="241" y="48" class="font-sans" font-size="20" font-weight="700" fill="#0a0a0a">$112.000</text>

        <rect x="450" y="0" width="210" height="64" rx="8" fill="#fafafa" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
        <text x="466" y="24" class="font-mono" font-size="10" fill="#aaaaaa">ASISTENCIA ESTIMADA</text>
        <text x="466" y="48" class="font-sans" font-size="20" font-weight="700" fill="#0f9960">96%</text>
