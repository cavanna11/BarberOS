        <line x1="12" y1="12" x2="300" y2="12" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
        <line x1="12" y1="12" x2="180" y2="12" stroke="#e03d00" stroke-width="2"/>
        
        <!-- Step 1 Done -->
        <circle cx="12" cy="12" r="10" fill="#e03d00"/>
        <text x="12" y="15" text-anchor="middle" class="font-sans" font-size="9" fill="#ffffff">✓</text>
        
        <!-- Step 2 Done -->
        <circle cx="70" cy="12" r="10" fill="#e03d00"/>
        <text x="70" y="15" text-anchor="middle" class="font-sans" font-size="9" fill="#ffffff">✓</text>

        <!-- Step 3 Done -->
        <circle cx="128" cy="12" r="10" fill="#e03d00"/>
        <text x="128" y="15" text-anchor="middle" class="font-sans" font-size="9" fill="#ffffff">✓</text>

        <!-- Step 4 Active -->
        <circle cx="186" cy="12" r="12" fill="#e03d00" stroke="#fdf0eb" stroke-width="3"/>
        <text x="186" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#ffffff">4</text>

        <!-- Step 5 -->
        <circle cx="244" cy="12" r="10" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
        <text x="244" y="15" text-anchor="middle" class="font-sans" font-size="9" fill="#aaaaaa">5</text>

        <!-- Step 6 -->
        <circle cx="302" cy="12" r="10" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
        <text x="302" y="15" text-anchor="middle" class="font-sans" font-size="9" fill="#aaaaaa">6</text>
      </g>

      <!-- Step Title & Subtitle -->
