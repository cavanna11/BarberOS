          <text x="24" y="44" class="font-mono" font-size="10" fill="#555555">45 min</text>
          
          <text x="100" y="28" class="font-sans" font-size="14" font-weight="600" fill="#0a0a0a">Lucas Méndez</text>
          <text x="100" y="44" class="font-sans" font-size="12" fill="#555555">Servicio Completo Premium</text>
          
          <text x="360" y="36" class="font-sans" font-size="13" font-weight="600" fill="#0a0a0a">$18.000</text>

          <rect x="490" y="17" width="118" height="26" rx="13" fill="#fdf4e7"/>
          <text x="549" y="34" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#b45309">• PENDIENTE</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(16, 268)">
          <rect x="0" y="0" width="628" height="56" rx="6" fill="#fafafa" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
          <text x="24" y="26" class="font-mono" font-size="15" font-weight="700" fill="#555555">15:00</text>
          <text x="24" y="42" class="font-mono" font-size="10" fill="#aaaaaa">30 min</text>
          
          <text x="100" y="26" class="font-sans" font-size="14" font-weight="600" fill="#0a0a0a">Joaquín Fernández</text>
          <text x="100" y="42" class="font-sans" font-size="12" fill="#555555">Perfilado de Barba</text>
          
          <text x="360" y="34" class="font-sans" font-size="13" font-weight="600" fill="#0a0a0a">$8.000</text>

