        <text x="0" y="16" class="font-sans" font-size="20" font-weight="700" fill="#0a0a0a" letter-spacing="-0.5">Elegí un horario</text>
        <text x="0" y="34" class="font-sans" font-size="12" fill="#555555">Viernes 7 de Agosto con Mateo</text>
      </g>

      <!-- Slot Grids -->
      <g transform="translate(0, 134)">
        <!-- Mañana -->
        <text x="0" y="12" class="font-sans" font-size="13" font-weight="600" fill="#0a0a0a">Mañana</text>
        <g transform="translate(0, 20)">
          <!-- 09:30 -->
          <rect x="0" y="0" width="70" height="38" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
          <text x="35" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0a0a0a">09:30</text>

          <!-- 10:15 SELECTED -->
          <rect x="80" y="0" width="70" height="38" rx="6" fill="#e03d00"/>
          <text x="115" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#ffffff">10:15</text>

          <!-- 11:00 -->
          <rect x="160" y="0" width="70" height="38" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
          <text x="195" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0a0a0a">11:00</text>

          <!-- 11:45 -->
          <rect x="240" y="0" width="70" height="38" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
          <text x="275" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0a0a0a">11:45</text>
        </g>

        <!-- Tarde -->
        <text x="0" y="82" class="font-sans" font-size="13" font-weight="600" fill="#0a0a0a">Tarde</text>
        <g transform="translate(0, 90)">
          <!-- 15:00 -->
          <rect x="0" y="0" width="70" height="38" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
          <text x="35" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0a0a0a">15:00</text>

          <!-- 15:45 -->
          <rect x="80" y="0" width="70" height="38" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
          <text x="115" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0a0a0a">15:45</text>

          <!-- 16:30 -->
          <rect x="160" y="0" width="70" height="38" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
          <text x="195" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0a0a0a">16:30</text>

          <!-- 17:15 -->
          <rect x="240" y="0" width="70" height="38" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
          <text x="275" y="23" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#0a0a0a">17:15</text>
        </g>
      </g>

      <!-- Selected Service Summary Card -->
      <g transform="translate(0, 305)">
        <rect x="0" y="0" width="316" height="54" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
        <text x="14" y="22" class="font-sans" font-size="12" font-weight="700" fill="#0a0a0a">Corte + Perfilado de Barba</text>
        <text x="14" y="38" class="font-sans" font-size="11" fill="#555555">⏱ 45 min · $15.000</text>
      </g>

      <!-- CTA Button -->
      <g transform="translate(0, 375)">
        <rect x="0" y="0" width="316" height="46" rx="8" fill="#e03d00"/>
        <text x="158" y="28" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Continuar →</text>
      </g>
    </g>

    <!-- Home indicator bar -->
    <rect x="122" y="562" width="136" height="4" rx="2" fill="#0a0a0a"/>
  </g>
</svg>
