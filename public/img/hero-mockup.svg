        <rect x="0" y="0" width="110" height="32" rx="6" fill="#fdf4e7" stroke="rgba(180, 83, 9, 0.2)" stroke-width="1"/>
        <text x="55" y="20" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#b45309">⏳ 3 pendientes</text>
        
        <!-- Walkin button -->
        <rect x="120" y="0" width="164" height="32" rx="6" fill="#e03d00"/>
        <text x="202" y="20" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#ffffff">✂️ Servicio sin turno</text>
      </g>

