        <rect x="0" y="0" width="660" height="340" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
        
        <text x="20" y="32" class="font-sans" font-size="15" font-weight="700" fill="#0a0a0a">📋 Agenda de hoy</text>
        
        <!-- Row 1 (Highlight: matching mobile step) -->
        <g transform="translate(16, 50)">
          <rect x="0" y="0" width="628" height="68" rx="6" fill="#fdf0eb" stroke="#e03d00" stroke-width="1.5"/>
          <rect x="0" y="0" width="6" height="68" fill="#e03d00" rx="2"/>
          <text x="24" y="32" class="font-mono" font-size="16" font-weight="700" fill="#e03d00">10:15</text>
          <text x="24" y="48" class="font-mono" font-size="10" fill="#555555">30 min</text>
          
          <text x="100" y="32" class="font-sans" font-size="14" font-weight="700" fill="#0a0a0a">Santiago Rossi</text>
          <text x="100" y="48" class="font-sans" font-size="12" fill="#555555">Corte + Perfilado de Barba</text>
          
          <text x="360" y="40" class="font-sans" font-size="13" font-weight="600" fill="#0a0a0a">$15.000</text>

