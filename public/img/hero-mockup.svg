          <rect x="0" y="0" width="628" height="60" rx="6" fill="#f2f2f2" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
          <text x="24" y="28" class="font-mono" font-size="15" font-weight="700" fill="#0a0a0a">11:00</text>
          <text x="24" y="44" class="font-mono" font-size="10" fill="#555555">30 min</text>
          
          <text x="100" y="28" class="font-sans" font-size="14" font-weight="600" fill="#0a0a0a">Gonzalo Pérez</text>
          <text x="100" y="44" class="font-sans" font-size="12" fill="#555555">Corte Clásico</text>
          
          <text x="360" y="36" class="font-sans" font-size="13" font-weight="600" fill="#0a0a0a">$12.000</text>

          <rect x="490" y="17" width="118" height="26" rx="13" fill="#eaf7f1"/>
          <text x="549" y="34" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#0f9960">• CONFIRMADO</text>
