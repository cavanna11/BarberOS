  <!-- FOREGROUND MOBILE PHONE MOCKUP -->
  <g transform="translate(570, 20)">
    <!-- Outer Phone Shadow / Border -->
    <rect x="-6" y="-6" width="392" height="592" rx="42" fill="none" stroke="rgba(0,0,0,0.14)" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="580" rx="36" fill="#0a0a0a"/>
    
    <!-- Phone Screen Container -->
    <rect x="8" y="8" width="364" height="564" rx="30" fill="#fafafa"/>
    
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="132" y="16" width="116" height="24" rx="12" fill="#0a0a0a"/>

    <!-- Screen Content Header -->
    <g transform="translate(24, 52)">
      <!-- Brand title -->
      <text x="0" y="16" class="font-sans" font-size="18" font-weight="700" fill="#0a0a0a">LA BARBERÍA</text>
      <text x="0" y="30" class="font-mono" font-size="9" font-weight="700" fill="#e03d00" letter-spacing="1">BARBEROS.APP/LABARBERIA</text>
      
      <!-- Stepper (6 steps) -->
