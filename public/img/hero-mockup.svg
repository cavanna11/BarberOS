<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <style>
      .font-sans { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Space Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- DESKTOP BACKDROP WINDOW -->
  <g transform="translate(10, 10)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="720" height="580" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" />
    
    <!-- Window Header / Browser Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 708 0 Q 720 0 720 12 L 720 44 L 0 44 Z" fill="#f2f2f2"/>
    <line x1="0" y1="44" x2="720" y2="44" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <!-- Window Controls -->
    <circle cx="20" cy="22" r="5" fill="#e05252"/>
    <circle cx="36" cy="22" r="5" fill="#e5c158"/>
    <circle cx="52" cy="22" r="5" fill="#52c41a"/>
    <!-- URL Bar -->
    <rect x="180" y="10" width="360" height="24" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <text x="360" y="26" text-anchor="middle" class="font-mono" font-size="11" fill="#555555">barberos.app/admin/dashboard</text>

    <!-- Admin Content Area -->
    <g transform="translate(24, 64)">
