<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
    </style>
  </defs>
  <rect x="0" y="0" width="280" height="120" rx="8" fill="#fafafa" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  
  <g transform="translate(12, 12)">
    <!-- Role 1: Owner View -->
    <rect x="0" y="0" width="256" height="42" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="20" cy="21" r="10" fill="#0a0a0a"/>
    <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#ffffff">👑</text>
    <text x="36" y="17" class="font-sans" font-size="11" font-weight="700" fill="#0a0a0a">Rol Dueño</text>
    <text x="36" y="30" class="font-sans" font-size="9" fill="#555555">Caja, equipo y estadísticas</text>
    <rect x="194" y="11" width="52" height="20" rx="10" fill="#fdf0eb"/>
    <text x="220" y="24" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#e03d00">TODO</text>

    <!-- Role 2: Barber View -->
    <rect x="0" y="50" width="256" height="42" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="20" cy="71" r="10" fill="#e03d00"/>
    <text x="20" y="75" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#ffffff">💈</text>
    <text x="36" y="67" class="font-sans" font-size="11" font-weight="700" fill="#0a0a0a">Rol Barbero</text>
    <text x="36" y="80" class="font-sans" font-size="9" fill="#555555">Sus turnos del día</text>
    <rect x="172" y="61" width="74" height="20" rx="10" fill="#f2f2f2"/>
    <text x="209" y="74" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#555555">SUS TURNOS</text>
  </g>
</svg>
