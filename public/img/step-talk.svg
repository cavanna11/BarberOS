<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: 'Space Grotesk', sans-serif; }
    </style>
  </defs>
  <!-- Onboarding Chat Bubbles -->
  <g transform="translate(10, 10)">
    <!-- Bubble 1: Barber asking -->
    <rect x="0" y="0" width="100" height="34" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
    <text x="12" y="21" class="font-sans" font-size="11" font-weight="600" fill="#0a0a0a">Somos 3 barberos...</text>

    <!-- Bubble 2: BarberOS setup reply in brand orange -->
    <rect x="36" y="26" width="104" height="34" rx="8" fill="#e03d00"/>
    <text x="48" y="47" class="font-sans" font-size="11" font-weight="600" fill="#ffffff">¡Listo, configurado!</text>
  </g>
</svg>
